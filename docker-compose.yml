services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - chroma_data:/app/data/chroma
      - upload_data:/app/data/uploads
      - store_data:/app/data/store
    restart: unless-stopped

volumes:
  chroma_data:
  upload_data:
  store_data:
